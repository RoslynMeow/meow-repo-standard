name: project-date

# Sets Project "Start date" from issue creation and "Date" from issue close.
# Project items are Issues only; pull requests are implementation artifacts
# and are never added to the Project.
#
# Requires a repository secret PROJECT_TOKEN: a classic PAT with `repo` +
# `project` scopes (the default GITHUB_TOKEN cannot access Projects v2).
# Optional repository variable PROJECT_TITLE (default: "<repo> Roadmap").

on:
  issues:
    types: [opened, reopened, closed]
  workflow_dispatch:
    inputs:
      number:
        description: Issue number
        required: true
        type: string

permissions:
  contents: read

jobs:
  set-dates:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_TITLE: ${{ vars.PROJECT_TITLE }}
    steps:
      - name: Set project dates
        if: ${{ env.PROJECT_TOKEN != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectTitle = process.env.PROJECT_TITLE || `${context.repo.repo} Roadmap`;
            let issue = context.payload.issue;

            if (context.eventName === 'workflow_dispatch') {
              const data = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(context.payload.inputs.number),
              });
              issue = data.data;
            }

            if (!issue || issue.pull_request) {
              core.info('not an issue; project items are issues only');
              return;
            }

            const startDate = issue.created_at.slice(0, 10);
            const closeDate = issue.closed_at ? issue.closed_at.slice(0, 10) : null;

            const projects = await github.graphql(
              `query { viewer { projectsV2(first: 100) { nodes { id title } } } }`,
            );
            const project = projects.viewer.projectsV2.nodes.find((p) => p.title === projectTitle);
            if (!project) {
              core.warning(`project not found: ${projectTitle}`);
              return;
            }

            const fields = await github.graphql(
              `query($id:ID!){ node(id:$id){ ... on ProjectV2 { fields(first: 50){ nodes { ... on ProjectV2FieldCommon { id name dataType } } } } } }`,
              { id: project.id },
            );
            const startField = fields.node.fields.nodes.find((f) => f.name === 'Start date');
            const dateField = fields.node.fields.nodes.find((f) => f.name === 'Date');
            if (!startField && !dateField) {
              core.warning('Project has neither Start date nor Date field');
              return;
            }

            const items = await github.graphql(
              `query($p:ID!){ node(id:$p){ ... on ProjectV2 { items(first:100){ nodes { id content { ... on Issue { number } } } } } } }`,
              { p: project.id },
            );
            let item = items.node.items.nodes.find(
              (entry) => entry.content && entry.content.number === issue.number,
            );
            if (!item) {
              const added = await github.graphql(
                `mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item { id } } }`,
                { p: project.id, c: issue.node_id },
              );
              item = added.addProjectV2ItemById.item;
            }

            async function setDate(field, value) {
              if (!field || !value) return;
              await github.graphql(
                `mutation($p:ID!,$i:ID!,$f:ID!,$d:Date!){ updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{date:$d}}){ projectV2Item { id } } }`,
                { p: project.id, i: item.id, f: field.id, d: value },
              );
            }

            async function clearDate(field) {
              if (!field) return;
              try {
                await github.graphql(
                  `mutation($p:ID!,$i:ID!,$f:ID!){ clearProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f}){ projectV2Item { id } } }`,
                  { p: project.id, i: item.id, f: field.id },
                );
              } catch (error) {
                core.info(`could not clear date: ${error.message}`);
              }
            }

            await setDate(startField, startDate);
            if (closeDate) {
              await setDate(dateField, closeDate);
            } else {
              await clearDate(dateField);
            }

            core.info(`issue #${issue.number}: start=${startDate}, date=${closeDate || '-'}`);
